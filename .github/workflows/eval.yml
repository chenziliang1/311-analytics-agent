# The golden-set eval, run by hand: Actions -> eval -> Run workflow, or
# `gh workflow run eval.yml`. Never on a schedule or a pull request: each run
# is about $3 of model calls.
#
# Spends real money and reads the real warehouse, so it needs two repository
# secrets: ANTHROPIC_API_KEY, and SNOWFLAKE_PRIVATE_KEY (the PEM text of
# ~/.snowflake/citypulse/ro_rsa_key.p8). Without them the job says so and
# passes.
name: eval

on:
  workflow_dispatch:
    inputs:
      cases:
        description: "Case ids or prefixes, comma-separated; empty runs all"
        required: false
        default: ""
      judge:
        description: "Run the LLM judge (all five scores)"
        type: boolean
        default: true
      fast_path:
        description: "FAST_PATH on: compile plain metric questions, skip the SQL writer"
        type: boolean
        default: false
      golden:
        description: "Another golden file to grade, e.g. data/eval/holdout/colleague.yml; empty grades the golden set"
        required: false
        default: ""

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

# contents: write, for the one commit that records the run's row in
# data/eval/results.md on the branch it ran on.
permissions:
  contents: write

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Optional. With either set, the judge is a different model family from
      # the agent's (config picks it), instead of the agent grading itself.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      # Unticking "judge" gives the quick run: result matching only.
      JUDGE: ${{ inputs.judge == false && 'false' || 'true' }}
      CASES: ${{ inputs.cases }}
      FAST_PATH: ${{ inputs.fast_path == true && 'true' || 'false' }}
      GOLDEN: ${{ inputs.golden }}
    steps:
      - name: Check the secrets are set
        id: secrets
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] || [ -z "$SNOWFLAKE_PRIVATE_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY or SNOWFLAKE_PRIVATE_KEY is not set; skipping the eval."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.run == 'true'
      - uses: astral-sh/setup-uv@v10.3.0
        if: steps.secrets.outputs.run == 'true'
        with:
          python-version: "3.12"
      - name: Install
        if: steps.secrets.outputs.run == 'true'
        run: uv sync --locked
      - name: Grade
        if: steps.secrets.outputs.run == 'true'
        run: |
          args=()
          [ "$JUDGE" = "false" ] && args+=(--nojudge)
          [ -n "$CASES" ] && args+=(--cases "$CASES")
          [ -n "$GOLDEN" ] && args+=(--golden "$GOLDEN")
          set -o pipefail
          .venv/bin/agent-app grade "${args[@]}" 2>&1 | tee grade.log
      - name: Record the run
        # The row the command appended, committed as whoever ran the workflow.
        # On a failed gate too: a run that failed is the one worth a record.
        if: always() && steps.secrets.outputs.run == 'true'
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add data/eval/results.md
          if git diff --cached --quiet; then
            echo "results.md unchanged"
          else
            git commit -m "Recorded the golden-set eval run of $(date -u +%Y-%m-%d)"
            git push
          fi
      - name: Summary
        if: always() && steps.secrets.outputs.run == 'true'
        run: |
          {
            echo '## Golden-set eval'
            echo '```'
            sed -n '/ runs, /,/^Report:/p' grade.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always() && steps.secrets.outputs.run == 'true'
        with:
          name: eval-report
          path: tmp/eval/*.json
          if-no-files-found: ignore
