[project]
name = "agent_app"
description = "A BI agent that answers questions about 311 service requests from a Snowflake warehouse, built on Strands Agents, MCP and AWS Bedrock AgentCore."
version = "0.1.1"
requires-python = ">=3.12,<4.0"

# Core Dependencies
dependencies = [
    "func-args>=1.0.2,<2.0.0",      # inspect function/method arguments
    "pydantic>=2.11.10,<3.0.0",     # Data validation and settings management using Python type annotations
    "fastapi>=0.140.13,<1.0.0",      # Web framework
    "uvicorn>=0.38.0,<1.0.0",       # ASGI server
    "boto3>=1.43.0,<2.0.0",         # AWS SDK for Python
    # NOTE: no typed-wrapper or type-stub package for boto3 here on purpose. They
    # only buy editor autocompletion, and they pin to a boto3 version — when they
    # lag a release they break the install for everyone.
    # --- LLM provider SDKs, all of them, on purpose ---------------------------
    #
    # Core dependencies rather than extras, so that LLM_PROVIDER stays an
    # environment variable instead of becoming a build-time decision. An extra is
    # opt-in by definition: `uv sync` installs none unless named, and the Vercel
    # Python build has no way to know which one to name. With openai as the
    # default provider, leaving its SDK in an extra meant a deployment could not
    # reach any model at all.
    #
    # bedrock needs nothing extra: boto3 is already above (DynamoDB uses it too).
    "strands-agents[openai]>=1.50.2,<2.0.0",     # LLM_PROVIDER=openai (default)
    # >=2.0.0 is required by strands' OpenAIResponsesModel, which we use so that
    # function tools work with the reasoning models (see one_04_agent.py).
    "openai>=2.0.0,<3.0.0",
    "strands-agents[anthropic]>=1.50.2,<2.0.0",  # LLM_PROVIDER=anthropic
    "anthropic>=0.121.0,<1.0.0",
    "strands-agents[gemini]>=1.50.2,<2.0.0",     # LLM_PROVIDER=google
    "google-genai>=2.17.0,<3.0.0",
    # NOTE: no vercel-ai-sdk-mate here on purpose. Its data model was ~100 lines
    # of pydantic and is now vendored in agent_app/vendor/vercel_ai_sdk.py, which
    # also relaxes it so a future AI SDK release cannot break request parsing by
    # adding a message part type. See that file's docstring.
    "rich>=14.0.0,<15.0.0",         # Render rich text, tables, progress bars, syntax highlighting, markdown and more to the terminal
    "enum_mate>=0.1.1,<1.0.0",      # A Python library for enhanced Enum capabilities, including auto-generation of values and improved string representations.
    "psycopg2-binary>=2.9.1,<3.0.0",# PostgreSQL database adapter for Python
    "SQLAlchemy>=2.0.37,<3.0.0",    # SQL toolkit and Object-Relational Mapping (ORM) library for Python
    "tabulate>=0.9.0,<1.0.0",       # Pretty-print tabular data in Python
    "strands-agents>=1.50.2,<2.0.0",        # Strands Agents is a framework for building AI agents that can perform complex tasks by leveraging various tools and APIs. It provides a structured way to define agent behavior, manage tool usage, and handle interactions with external systems.
    "strands-agents-tools>=0.5.3,<1.0.0",  # Strands Agents Tools is a collection of utilities and integrations designed to enhance the functionality of Strands Agents. It includes pre-built tools for common tasks, such as web scraping, database interactions, and API calls, allowing developers to easily incorporate these capabilities into their agents without having to build them from scratch.
    "fire>=0.6.0,<1.0.0",           # Python library for creating command line interfaces (CLIs) from absolutely any Python object
    "python-dotenv>=1.2.1,<2.0.0",  # Read key-value pairs from a .env file and set them as environment variables
    "PyYAML>=6.0.0,<7.0.0",         # Reads the semantic layer in data/semantic_layer/
    "sqlglot>=30.0.0,<31.0.0",      # Parses generated SQL so the guard checks its AST, not its text
    "mcp>=1.26.0,<2.0.0",           # The MCP server the agent's tools are served from
    "snowflake-connector-python>=3.12.0,<5.0.0",  # The Snowflake warehouse (WAREHOUSE=snowflake)
    "snowflake-sqlalchemy>=1.7.0,<2.0.0",         # SQLAlchemy dialect for it, so one engine API serves both warehouses
]

[project.optional-dependencies]

# Only test dependencies are optional now. The LLM provider SDKs used to live
# here, one extra per provider, and that was wrong for this repo: an extra is
# opt-in, so nothing installs one in a deployment. They are core dependencies
# now -- see the comment next to them above.
test = [
    "pytest>=8.2.2,<9.0.0", # Testing framework
    "pytest-cov>=6.0.0,<7.0.0", # Coverage reporting
    "moto>=5.2.3,<6.0.0", # Mock AWS Service
]

# Local Bedrock credentials from `aws login` (stored under ~/.aws/login). boto3
# can only read those with the CRT extension; without it the first chat request
# fails with MissingDependencyException. Deployments authenticate with key
# environment variables, never install extras, and so never need this.
aws-login = [
    "botocore[crt]>=1.43.0,<2.0.0",
]

# Loading the seed into Snowflake (infra/snowflake/load.py): Parquet files
# through an internal stage. Only the loader needs these; the agent does not.
snowflake-load = [
    "pandas>=2.2.0,<4.0.0",
    "pyarrow>=17.0.0",
]

# The CDK app in infra/ that deploys the agent to AgentCore Runtime. An extra,
# not core: nothing the app runs at request time needs it, and it is large.
infra = [
    "aws-cdk-lib>=2.273.0,<3.0.0",
    "constructs>=10.0.0,<11.0.0",
]

# The app's own command line. `mise.toml` calls this name, not a file path, so
# where a command's implementation lives can move without every task and habit
# moving with it.
[project.scripts]
agent-app = "agent_app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_app*"]
exclude = [
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
